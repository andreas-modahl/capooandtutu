<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9f0ff"/>
      <stop offset="1" stop-color="#ffe2ef"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffeef6"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g stroke="#4a3f5c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <!-- ears (behind the head) -->
    <g fill="url(#fur)">
      <ellipse cx="196" cy="130" rx="34" ry="96" transform="rotate(-9 196 130)"/>
      <ellipse cx="316" cy="130" rx="34" ry="96" transform="rotate(9 316 130)"/>
    </g>
    <g fill="#ff9ec4" stroke="none">
      <ellipse cx="196" cy="136" rx="16" ry="66" transform="rotate(-9 196 136)"/>
      <ellipse cx="316" cy="136" rx="16" ry="66" transform="rotate(9 316 136)"/>
    </g>

    <!-- body -->
    <ellipse cx="256" cy="356" rx="132" ry="106" fill="url(#fur)"/>
    <!-- head -->
    <ellipse cx="256" cy="268" rx="122" ry="104" fill="url(#fur)"/>
  </g>

  <!-- face -->
  <g fill="#4a3f5c">
    <ellipse cx="212" cy="266" rx="13" ry="17"/>
    <ellipse cx="300" cy="266" rx="13" ry="17"/>
  </g>
  <g fill="#ff9ec4" opacity=".6">
    <ellipse cx="168" cy="302" rx="24" ry="14"/>
    <ellipse cx="344" cy="302" rx="24" ry="14"/>
  </g>
  <path d="M238 306q18 20 36 0" fill="none" stroke="#4a3f5c" stroke-width="9" stroke-linecap="round"/>

  <!-- little heart, so it reads as the Capoo & Tutu board -->
  <path d="M398 402c-13-14-34-4-34 13 0 16 20 27 34 39 14-12 34-23 34-39 0-17-21-27-34-13z"
        fill="#f473a8" stroke="#4a3f5c" stroke-width="8" stroke-linejoin="round"/>
</svg>
